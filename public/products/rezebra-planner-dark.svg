<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1304 942" role="img" aria-labelledby="title desc">
  <title id="title">Планировщик Rezebra — светлая тема</title>
  <desc id="desc">Светлая векторная схема интерфейса планировщика ресторана: список резервов, навигация, схема зала и временная шкала.</desc>
  <defs>
    <style>
      .ui{font-family:Inter,Arial,sans-serif;fill:#11130F}
      .label{font-size:15px;font-weight:600}
      .reservation-meta{font-size:16px;font-weight:600}
      .small{font-size:13px;font-weight:600}
      .micro{font-size:10px;font-weight:600}
      .time{font-size:28px;font-weight:600;letter-spacing:-.6px}
      .stroke{fill:none;stroke:#11130F;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
      .seat{fill:#bfc7d0;stroke:#354454;stroke-width:1}
      .table{fill:#88e984;stroke:#101510;stroke-width:1.3}
      .table-number{font-size:14px;font-weight:600;fill:#11130F}
      .table-text{fill:#0d120d;text-anchor:middle}
    </style>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
