      <g transform="translate(61 126)"><path d="M0 72h330" stroke="#C8C3AB"/><text x="10" y="47" class="time">11:30</text><text x="306" y="29" class="reservation-meta" text-anchor="end">1 РЕЗЕРВ</text><text x="306" y="53" class="reservation-meta" text-anchor="end">4 ГОСТЯ</text></g>
      <g transform="translate(61 198)"><path d="M0 72h330" stroke="#C8C3AB"/><text x="10" y="47" class="time">12:00</text><text x="306" y="29" class="reservation-meta" text-anchor="end">1 РЕЗЕРВ</text><text x="306" y="53" class="reservation-meta" text-anchor="end">5 ГОСТЕЙ</text></g>
      <g transform="translate(61 270)"><path d="M0 72h330" stroke="#C8C3AB"/><text x="10" y="47" class="time">12:45</text><text x="306" y="29" class="reservation-meta" text-anchor="end">1 РЕЗЕРВ</text><text x="306" y="53" class="reservation-meta" text-anchor="end">5 ГОСТЕЙ</text></g>
