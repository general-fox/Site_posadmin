    <linearGradient id="plant" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#72bd92"/>
      <stop offset="1" stop-color="#417a5b"/>
    </linearGradient>
    <symbol id="rect-table" viewBox="0 0 118 74">
