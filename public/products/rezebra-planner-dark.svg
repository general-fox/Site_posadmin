    <symbol id="home" viewBox="0 0 24 24"><path class="stroke" d="m3 10 9-7 9 7M6 8v13h12V8M10 21v-7h4v7"/></symbol>
    <symbol id="search" viewBox="0 0 24 24"><circle class="stroke" cx="10" cy="10" r="6"/><path class="stroke" d="m15 15 6 6"/></symbol>
    <symbol id="map" viewBox="0 0 24 24"><path class="stroke" d="m3 5 6-2 6 2 6-2v16l-6 2-6-2-6 2V5ZM9 3v16M15 5v16"/></symbol>
