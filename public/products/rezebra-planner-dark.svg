      <rect class="seat" x="48" y="67" width="22" height="7" rx="3.5"/>
      <rect class="seat" y="29" width="7" height="16" rx="3.5"/>
      <rect class="seat" x="111" y="29" width="7" height="16" rx="3.5"/>
      <rect class="table" x="8" y="8" width="102" height="58" rx="5"/>
    </symbol>
    <symbol id="round-table" viewBox="0 0 86 86">
      <rect class="seat" x="34" width="18" height="7" rx="3.5"/>
      <rect class="seat" x="34" y="79" width="18" height="7" rx="3.5"/>
      <rect class="seat" y="34" width="7" height="18" rx="3.5"/>
      <rect class="seat" x="79" y="34" width="7" height="18" rx="3.5"/>
      <circle class="table" cx="43" cy="43" r="35"/>
